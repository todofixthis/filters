# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: CI
on:
  push: ~
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          # Note: Use quotes to avoid float cast - especially important if the
          # version number ends with 0!
          - "3.14"
          - "3.13"
          - "3.12"

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group ci
      - name: Run tests
        run: uv run pytest

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Newest version in the test matrix. Reading `requires-python` from
          # pyproject.toml resolves to the latest CPython, which can outrun
          # dependency wheels.
          python-version: "3.15"
      - name: Install dependencies
        run: uv sync --group ci
      # Default rules, not strict — see
      # docs/adr/015-hold-the-type-checkers-to-their-default-rules.md.
      # `src` and `test/typing` are checked separately: `test/typing` is the
      # assert_type harness and holds the rest of `test/` to a different
      # (currently unenforced) bar.
      - name: Run mypy on src
        run: uv run mypy src
      - name: Run mypy on test/typing
        run: uv run mypy test/typing
      - name: Run pyright on src
        run: uv run pyright src/filters
      - name: Run pyright on test/typing
        run: uv run pyright test/typing

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Newest version in the test matrix. Reading `requires-python` from
          # pyproject.toml resolves to the latest CPython, which can outrun
          # dependency wheels.
          python-version: "3.15"
      - name: Install dependencies
        run: uv sync --group ci
      - name: Check docs build
        run: |
          cd docs
          uv run make html

  # The phx plugin's hooks check ADRs in Claude Code sessions but never block, so
  # this is the only check a commit made elsewhere meets (ADR 014 forbids a
  # repo-local copy of the tool). The ref is the 8.1.0 release's commit; bump it,
  # and every copy in AGENTS.md, with the plugin release sessions use.
  adrs:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check ADRs
        run: uvx --from 'git+https://github.com/todofixthis/phx-claude-siat@0725567cec6bab6a227c2a3d569e64c226c33a4e#subdirectory=skills/writing-adrs' phx-adr check
