[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phx-filters"
version = "4.0.0a2"
description = "Validation and data pipelines made easy!"
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
requires-python = ">=3.12, <4"
readme = "README.rst"
license = "MIT"
keywords = [
    "data processing",
    "pipeline",
    "transformation",
    "validation",
]

# Leave out `Development Status`: the version's pre-release segment states it,
# and a hand-kept classifier goes stale (see
# https://github.com/todofixthis/cookiecutter-py/blob/main/docs/adr/023-leave-the-development-status-classifier-out-of-generated-projects.md).
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "phx-class-registry>=6,<7",
    "python-dateutil>=4,<5",
    "pytz>=2025",
    "regex>=2024",
    "typing-extensions>=4.15.0,<5.0.0",
]

[project.entry-points."pytest11"]
filters = "filters.pytest"

[project.optional-dependencies]
django = ["phx-filters-django"]
iso = ["phx-filters-iso"]

[project.urls]
Repository = "https://github.com/todofixthis/filters"
Documentation = "https://filters.readthedocs.io/"
Changelog = "https://github.com/todofixthis/filters/releases"
Issues = "https://github.com/todofixthis/filters/issues"

[dependency-groups]
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-mypy>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "black>=26,<27",
    # >=3.29 fixes an OSError on Docker/macOS volume mounts (fcntl file locking)
    "filelock>=3.29",
    # Pinned to patch level: a type checker can add diagnostics in a minor
    # release, unlike an ordinary dependency, which only changes behaviour
    # at a major one — so the range stops at today's minor, and only patch
    # releases flow in without a manual bump. pyright ships every release
    # as 1.1.x, so uv.lock is what holds it. See
    # docs/adr/016-run-the-type-checkers-in-strict-mode.md.
    "mypy>=2.4,<2.5",
    "pyright>=1.1.411,<1.2",
    "pytest>=9,<10",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
    "tox>=4,<5",
    "tox-uv>=1.23.0,<2",
    "types-python-dateutil>=2,<3",
    "types-pytz>=2025",
]
ci = [
    # Same patch-level pin as the dev group above; see
    # docs/adr/016-run-the-type-checkers-in-strict-mode.md.
    "mypy>=2.4,<2.5",
    "pyright>=1.1.411,<1.2",
    "pytest>=9,<10",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
]

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.mypy",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
    # Runs a strict, full-reread Sphinx build on staged docs/docstring
    # changes (see docs/adr/012-check-the-docs-build-in-the-pre-commit-hook.md)
    # — removing this reopens a gap neither CI nor the pre-commit chain
    # otherwise catches.
    "docs_build",
]

[tool.autohooks.plugins.mypy]
# Matches the CI scope: `src` and the `test/typing` assert_type harness,
# not the rest of `test/`. See
# docs/adr/016-run-the-type-checkers-in-strict-mode.md.
include = ["src/*.py", "test/typing/*.py"]

[tool.mypy]
# A filter rejects a value by returning `_invalid_value()`'s result (`Any`,
# `None` by default) from a non-Optional `_apply`. Re-enable both codes once
# #121 makes rejection raise instead. See
# docs/adr/016-run-the-type-checkers-in-strict-mode.md.
disable_error_code = ["no-any-return", "return-value"]
ignore_missing_imports = true
strict = true

[tool.pyright]
# Keeps each checker to its own suppressions. Most `# type: ignore[...]`
# comments suppress mypy-only diagnostics, which
# reportUnnecessaryTypeIgnoreComment below would otherwise misread as
# unused; where both checkers report a line (test/typing's negative cases),
# honouring the mypy comment would make the `# pyright: ignore` twin look
# unused instead. Pyright-specific suppressions still use
# `# pyright: ignore[code]`, which this setting does not affect.
enableTypeIgnoreComments = false
# The same exemption as mypy's two codes above, for the same reason.
reportReturnType = false
# Closes the gap where a suppression that stops being needed decays
# silently. See docs/adr/016-run-the-type-checkers-in-strict-mode.md.
reportUnnecessaryTypeIgnoreComment = "error"
typeCheckingMode = "strict"

[tool.hatch.build.targets.sdist]
include = [
    "src/filters",
    "LICENCE.txt",
    "docs",
    "test",
]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel]
include = ["src/filters"]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel.sources]
"src/filters" = "filters"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff.lint]
ignore = [
    # A constant getattr/setattr reaches an attribute the strict type checkers
    # can't see (`context` on any exception, namedtuple's `_fields`).
    "B009",
    "B010",
    # Catching any exception is how a filter turns an error into an invalid
    # value (ExceptionHandler, Call, FilterChain).
    "BLE001",
    # BaseFilter declares `templates` as an instance attribute, so a subclass
    # annotating it `ClassVar`, as RUF012 asks, fails mypy's override check.
    "RUF012",
    # Keep `Hashable` from `typing`, and `TypeAliasType` and `TypeVar` from
    # typing_extensions, whose PEP 696 defaults Python 3.12 lacks; for the
    # same reason, keep `Generic` rather than PEP 695 type parameters.
    "UP035",
    "UP046",
    # Keep `Optional` and `Union`: a forward reference needs them, since
    # `"ClassName" | None` fails at runtime under Sphinx, and pyupgrade's
    # rewrite of the quoted annotations in `__or__`'s overloads breaks pyright.
    "UP007",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# The package's imports and `__all__` are grouped by module, in the order the
# modules depend on each other.
"src/filters/__init__.py" = ["I001", "RUF022"]

[tool.tox]
env_list = ["py314", "py313", "py312"]

[tool.tox.env_run_base]
commands = [
    ["pytest"],
    ["mypy", "src"],
    ["mypy", "test/typing"],
    ["pyright", "src/filters"],
    ["pyright", "test/typing"],
]
runner = "uv-venv-lock-runner"

[tool.uv]
keyring-provider = "subprocess"
# Fix SSL errors when running in Leash containers
system-certs = true
